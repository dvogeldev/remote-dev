name: publish-base-image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.base
      - .github/workflows/publish-base-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/remote-dev-base:1-noble
            ghcr.io/${{ github.repository_owner }}/remote-dev-base:noble
            ghcr.io/${{ github.repository_owner }}/remote-dev-base:latest
