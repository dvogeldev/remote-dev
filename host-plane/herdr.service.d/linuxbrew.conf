# Drop-in so Herdr panes see Homebrew on Linux (ADR-0008).
# Merge with ~/.config/systemd/user/herdr.service — do not replace ExecStart.
[Service]
Environment=PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:/home/david/.local/share/mise/shims:/home/david/.local/bin:/usr/local/bin:/usr/bin:/bin
